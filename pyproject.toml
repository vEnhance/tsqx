[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tsqx/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["tsqx"]

[tool.hatch.envs.default.scripts]
tsqx = "python -m tsqx"

[project]
name = "tsqx"
description = "Asymptote pre-processor for Euclidean geometry diagrams"
authors = [
  { name = "Evan Chen", email = "evan@evanchen.cc" },
  { name = "CJ Quines", email = "cj@cjquines.com" }
]
license = { text = "MIT" }
readme = "README.md"
urls = { repository = "https://github.com/vEnhance/tsqx/" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "prek>=0.2.25",
]
dynamic = ["version"]

[project.scripts]
tsqx = "tsqx.__main__:main"

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "ty>=0.0.7",
    "toml>=0.10.2",
    "ruff>=0.9.7",
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.codespell]
count = ""
quiet-level = 3
